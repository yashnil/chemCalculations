[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemcalculations"
version = "0.1.0"
description = "PyTorch neural network emulator for FastChem gas-phase chemical equilibrium in planetary and exoplanet atmospheres."
readme = "README.md"
requires-python = ">=3.9"
# SPDX expression (see https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license)
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashnil Mohanty" }]
keywords = [
    "fastchem",
    "astronomy",
    "exoplanets",
    "atmospheres",
    "pytorch",
    "machine-learning",
    "emulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
fastchem = ["pyfastchem>=3.0"]
dev = ["pytest>=7.0"]
# Tools for publishing to PyPI (see RELEASING.md)
release = ["build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/yashnil/chemCalculations"
Repository = "https://github.com/yashnil/chemCalculations"
Documentation = "https://github.com/yashnil/chemCalculations#readme"
PyPI = "https://pypi.org/project/chemcalculations/"

[project.scripts]
chemcalc-train = "chemcalculations.train_autoencoder:main"
chemcalc-train-improved = "chemcalculations.train_autoencoder_improved:main"
chemcalc-diagnostics = "chemcalculations.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
